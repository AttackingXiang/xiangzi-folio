name: Build and release extension

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    outputs:
      asset_name: ${{ steps.package.outputs.asset_name }}
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test -- --run
      - run: npm run build
      - id: package
        run: |
          version="$(node -p "require('./package.json').version")"
          asset_name="xiangzi-folio-extension-v${version}.zip"
          mkdir -p release
          (cd dist && zip -qr -X "../release/${asset_name}" .)
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "asset_name=${asset_name}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: xiangzi-folio-extension
          path: release/${{ steps.package.outputs.asset_name }}
          if-no-files-found: error

  publish-release:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: verify-and-package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: xiangzi-folio-extension
          path: release
      - env:
          GH_TOKEN: ${{ github.token }}
          ASSET_NAME: ${{ needs.verify-and-package.outputs.asset_name }}
          VERSION: ${{ needs.verify-and-package.outputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            release_tag="$GITHUB_REF_NAME"
          else
            release_tag="v${VERSION}"
          fi

          if gh release view "$release_tag" >/dev/null 2>&1; then
            gh release upload "$release_tag" "release/${ASSET_NAME}" --clobber
          else
            gh release create "$release_tag" "release/${ASSET_NAME}" --target "$GITHUB_SHA" --title "Xiangzi Folio ${release_tag}" --generate-notes
          fi
